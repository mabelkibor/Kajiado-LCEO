[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kajiado-lceo"
version = "0.1.0"
description = "GIS-aided techno-economic modelling of least-cost electrification pathways in Kajiado County, Kenya"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Mabel Chelagat Kibor"}]
keywords = [
    "electrification", "energy-access", "GIS", "techno-economic", "LCOE",
    "mini-grid", "OnSSET", "Kenya", "Kajiado",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: GIS",
]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "PyYAML>=6.0",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
gis = [
    "geopandas>=0.14",
    "shapely>=2.0",
    "pyproj>=3.6",
    "rasterio>=1.3",
    "rtree>=1.1",
]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.4",
    "mypy>=1.8",
    "pre-commit>=3.6",
    "nbstripout>=0.7",
]
notebooks = ["jupyterlab>=4.0", "ipykernel>=6.29", "folium>=0.15"]

[project.scripts]
lceo = "kajiado_lceo.cli:main"

[project.urls]
Repository = "https://github.com/mabelkibor/kajiado-lceo"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
kajiado_lceo = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "slow: end-to-end runs over the full synthetic county",
    "gis: requires the optional geopandas stack",
]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "PTH", "RUF"]
ignore = [
    "E501",    # long lines in equation docstrings are deliberate
    "N803",    # equation symbols (E_c, H_c, P_c) keep their published casing
    "N806",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B018"]

[tool.mypy]
python_version = "3.10"
packages = ["kajiado_lceo"]
ignore_missing_imports = true
warn_unused_ignores = true
